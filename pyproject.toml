[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "databridge-takehome"
version = "0.1.0"
description = "Local and SFTP data transfer service"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.141.1,<1",
  "paramiko>=5,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=2.3.1,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "types-paramiko>=5.0.0.20260724,<6",
]

[tool.setuptools.packages.find]
include = ["databridge*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = ["integration: requires the Docker SFTP fixture"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use the fixture's published test password, and run the shell script under test.
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
strict = true
packages = ["databridge"]
python_version = "3.12"
