[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "databridge-takehome"
version = "0.1.0"
description = "Local and SFTP data transfer service"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.141.1,<1",
  "paramiko>=5,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["databridge*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires the Docker SFTP fixture"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
