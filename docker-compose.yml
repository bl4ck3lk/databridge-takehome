# The project name comes from COMPOSE_PROJECT_NAME, which `make quickstart` writes to .env for
# each checkout, so two checkouts never share a container or its host-key volume.
services:
  sftp:
    image: atmoz/sftp:alpine-3.7
    platform: linux/amd64
    ports:
      - "127.0.0.1:${DATABRIDGE_SFTP_PORT:-2222}:22"
    # The container user takes the UID quickstart stores: the host user's, so the bind-mounted
    # sftp_data is writable, or 1001 on a root host, because sshd refuses UID 0 logins.
    command: testuser:testpass:${DATABRIDGE_SFTP_UID:-1001}
    volumes:
      - ./sftp_data:/home/testuser/data
      - sftp_host_keys:/etc/ssh

volumes:
  sftp_host_keys:
